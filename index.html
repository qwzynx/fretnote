<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#211f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fretnote</title>
    <!-- Fonts are self-hosted (see globals.css). Preloading the two latin
         faces lets them start downloading alongside the CSS rather than
         after it, so there is no visible swap on a cold start. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Paint the app ground before the stylesheet lands, so a cold start
         never flashes white. Must track --background in globals.css. */
      html,
      body {
        background: oklch(0.155 0.006 60);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
