name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Fretnote ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            | Platform | Installer |
            |---|---|
            | Windows | `.exe` (NSIS) or `.msi` |
            | Linux | `.AppImage` (portable) or `.deb` |
            | macOS | `.dmg` |
            | Android | `.apk` (see android job) |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    # The desktop jobs create the draft release; this job only adds the APK to it.
    needs: release-desktop
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and targets
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;35.0.0"
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - run: npm ci

      - name: Init Tauri Android
        run: npm run tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Build Android APK
        run: npm run tauri android build -- --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      # Android refuses to install an unsigned APK, so the artifact tauri
      # produces is not directly usable. Sign it with the release keystore.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see README for keystore setup."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT

          # Tolerate wrapped/padded secrets: strip whitespace before decoding.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-set it with: base64 -w0 fretnote-release.p12 | gh secret set ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi

          # Fails loudly on a wrong store password or a non-PKCS12 payload,
          # rather than surfacing later as a confusing apksigner error.
          if ! keytool -list -keystore "$keystore" -storetype PKCS12 \
                 -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Cannot open the keystore -- wrong ANDROID_KEYSTORE_PASSWORD, or the secret is not a PKCS12 file."
            sed -e 's/^/  /' "$RUNNER_TEMP/ks.txt" | head -20
            exit 1
          fi

          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "fretnote-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "fretnote-${GITHUB_REF_NAME}.apk"

      # Uploads the asset only. Editing the release itself (name/draft/body) is
      # left to the desktop jobs -- a PATCH from here is rejected with
      # "Resource not accessible by integration" even with contents: write.
      - name: Upload APK to release
        run: gh release upload "$GITHUB_REF_NAME" "fretnote-${GITHUB_REF_NAME}.apk" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
